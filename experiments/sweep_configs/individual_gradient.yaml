name: individual_gradient_optimization_v2
method: bayes
metric:
  name: ms_ssim_l1_max
  goal: minimize
early_terminate:
  type: hyperband
  strict: true
parameters:
  # Base hyperparameters similar to optimal.yaml
  variant:
    value: double-band
  lr:
    min: 0.001
    max: 0.03
  max_sigma: #deprecated
    value: 10.0
  # enhancement on high frequencies
  high_min_enhancement:
    min: 0.1
    max: 0.5
  high_sigma:
    value: 10.0
  low_min_enhancement:
    min: 0.1
    max: 0.6
  sigma:
    value: 1.0
  data_fidelity:
    value: l2
  max_enhancement:
    value: 0.8
    # min: 0.5
    # max: 0.75
  n_steps:
    values:
      - 300
      # - 500
  total_variation:
    min: 1.e-9
    max: 1.e-5
  prior_weight:
    min: 0.0
    max: 0.0005
  PRNGKey:
    value: 0
  tm_init_params:
    values:
      # - - negative
      #   - null
      - - naive
        - null
  constant_weights:
    value: false
  eps:
    values:
      - 1.e-6
      - 1.e-7
  smooth_metric:
    values:
      - tv
      - tikonov
      - none
      # - tv
      # - tv2
  use_band_similarity:
    value: false
    # values:
    #   - true
    #   - false
  windowing_type:
    # value: sigmoid
    values:
      - sigmoid
      - linear

  # Individual gradient optimizer specific parameters
  optimizer:
    values:
      # - adam
      - amsgrad
      # - rmsprop
      # - adamw
  # Optimizer-specific parameters
  momentum:
    value: 0.9 # For SGD
  weight_decay:
    value: 0.0001
    # values:
    #   - 0.0
    #   - 0.0001
    #   - 0.001

  batch_size:
    value: 8
  # Sub-batch processing
  sub_batch_size:
    values:
      - 4
