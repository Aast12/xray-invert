name: individual_gradient_optimization
method: bayes
metric:
  name: ms_ssim_l1_max
  goal: minimize 
early_terminate:
  type: hyperband
  strict: true
parameters:
  # Base hyperparameters similar to optimal.yaml
  variant:
    value: double-band
  lr:
    min: 0.001
    max: 0.03 
  max_sigma:
    value: 4.0
  sigma:
    min: 1.5
    max: 2.0
  high_sigma:
    min: 5.0
    max: 7.0
  data_fidelity:
    value: l2
    # values:
    #   - l2
      # - ssim
  max_enhancement:
    value: 0.8
    # min: 0.5
    # max: 0.75
  n_steps:
    values:
      - 300
      - 500
  total_variation:
    # value: 0.
    min: 0.00000001
    max: 0.000003
  prior_weight:
    min: 0.8
    max: 1.0 
  PRNGKey:
    value: 0
  tm_init_params:
    values: 
      - - negative
        - null
      - - naive 
        - null
  constant_weights:
    value: false
  eps:
    value: 1.e-6
  smooth_metric:
    value: tikonov
    # values:
      # # - tv
      # - tikonov
      # - none
      # - tv2
  use_band_similarity:
    value: false
    # values:
    #   - true
    #   - false
  windowing_type:
    value: sigmoid
    # values:
    #   - sigmoid
    #   - linear
  
  # Individual gradient optimizer specific parameters
  optimizer:
    values:
      # - adam
      - amsgrad
      # - rmsprop
      # - adamw
  # Optimizer-specific parameters
  momentum:
    value: 0.9  # For SGD
  weight_decay:
    value: 0.0001
    # values:
    #   - 0.0
    #   - 0.0001
    #   - 0.001
  
  batch_size:
    value: 24
  # Sub-batch processing
  sub_batch_size:
    values:
      - 8