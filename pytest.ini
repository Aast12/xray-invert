[tool:pytest]

testpaths = chest_xray_sim/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

markers =
    data_loading: Tests for data loading functionality
    chexpert: Tests specifically for CheXpert dataset
    slow: Tests that take a long time to run
    integration: Integration tests that test multiple components
    unit: Unit tests for individual functions/classes

minversion = 6.0

timeout = 300

# Coverage settings (when using pytest-cov)
# addopts = --cov=chest_xray_sim --cov-report=html --cov-report=term-missing
